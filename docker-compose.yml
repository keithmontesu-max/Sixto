services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: sixto
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: sixto
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  admin:
    build: ./admin-web
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

  techtool:
    build: ./techtool
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000/api/v1
    ports:
      - "3001:3000"
    depends_on:
      - backend

volumes:
  pgdata:
