name: Build TECHTOOL APK

on:
  push:
    paths:
      - 'techtool-app/**'
      - '.github/workflows/build-techtool.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android/actions/setup-android@v3

      - name: Build TECHTOOL APK (Debug)
        working-directory: techtool-app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SIXTO-TECHTOOL-debug
          path: techtool-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Smoke check
        run: |
          ls -lh techtool-app/app/build/outputs/apk/debug/
          echo "TECHTOOL APK built ✅"
